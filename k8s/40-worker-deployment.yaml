apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-worker
  namespace: banking-devops-platform
  labels:
    app: banking-worker
    component: worker
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: banking-worker
  template:
    metadata:
      labels:
        app: banking-worker
        component: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: worker
          image: banking-devops-platform:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/workers/transaction.worker.js"]
          ports:
            - containerPort: 3001
              name: metrics
          envFrom:
            - configMapRef:
                name: banking-config
            - secretRef:
                name: banking-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
