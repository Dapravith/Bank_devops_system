apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-web
  namespace: banking-devops-platform
  labels:
    app: banking-web
    component: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: banking-web
  template:
    metadata:
      labels:
        app: banking-web
        component: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: web
          image: banking-devops-platform-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            # In-cluster, the browser would still hit a public URL through
            # Ingress. Override at apply time when you know the public host:
            # `kubectl set env deployment/banking-web NEXT_PUBLIC_API_BASE_URL=https://api.banking.example.com`
            - name: NEXT_PUBLIC_API_BASE_URL
              value: http://localhost:3000
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "384Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
