# EXAMPLE ONLY. Do NOT commit real values.
# Copy to k8s/02-secret.yaml and replace the base64 values, then `kubectl apply -f k8s/02-secret.yaml`.
# Generate base64: `echo -n 'value' | base64`
apiVersion: v1
kind: Secret
metadata:
  name: banking-secret
  namespace: banking-devops-platform
type: Opaque
stringData:
  # Inside the cluster these point to the in-cluster Postgres and Redis services below.
  DATABASE_URL: "postgresql://banking:banking@postgres:5432/banking?schema=public"
  REDIS_URL: "redis://redis:6379"
