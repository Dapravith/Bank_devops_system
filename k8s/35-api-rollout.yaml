# Argo Rollouts canary strategy for the API.
#
# Requires the Argo Rollouts controller installed in the cluster:
#   kubectl create namespace argo-rollouts
#   kubectl apply -n argo-rollouts -f \
#     https://github.com/argoproj/argo-rollouts/releases/latest/download/install.yaml
#
# When using this Rollout, REMOVE k8s/30-api-deployment.yaml from `kubectl apply`
# (or delete the Deployment first). Rollout owns the same Service selector.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: banking-api
  namespace: banking-devops-platform
  labels:
    app: "banking-api"
    component: "api"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: "banking-api"
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      canaryService: banking-api-canary
      stableService: banking-api
      steps:
        - setWeight: 20
        - pause: { duration: "1m" }
        - setWeight: 40
        - pause: { duration: "2m" }
        - setWeight: 60
        - pause: { duration: "2m" }
        - setWeight: 80
        - pause: { duration: "2m" }
      analysis:
        templates:
          - templateName: api-success-rate
        startingStep: 1
        args:
          - name: service-name
            value: banking-api-canary
  template:
    metadata:
      labels:
        app: "banking-api"
        component: "api"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: banking-devops-platform:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "npx prisma migrate deploy && node dist/server.js"]
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: banking-config
            - secretRef:
                name: banking-secret
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /ready, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: banking-api-canary
  namespace: banking-devops-platform
  labels:
    app: "banking-api"
    role: "canary"
spec:
  type: ClusterIP
  selector:
    app: "banking-api"
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
# AnalysisTemplate: gates each canary step on success-rate from Prometheus.
# The Prometheus address must be reachable from the cluster — adjust as needed.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: api-success-rate
  namespace: banking-devops-platform
spec:
  args:
    - name: service-name
  metrics:
    - name: success-rate
      interval: 30s
      count: 4
      successCondition: result[0] >= 0.98
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local:80
          query: |
            sum(rate(http_requests_total{app="banking-devops-platform",status!~"5.."}[1m]))
            /
            sum(rate(http_requests_total{app="banking-devops-platform"}[1m]))
