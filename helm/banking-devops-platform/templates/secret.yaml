# In production, replace this Secret with a reference to External Secrets / Vault.
# This template is for portfolio convenience only.
apiVersion: v1
kind: Secret
metadata:
  name: banking-secret
  labels: {{- include "banking.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  PARTNER_JWT_SECRET: {{ .Values.secrets.partnerJwtSecret | quote }}
  ADMIN_API_KEY: {{ .Values.secrets.adminApiKey | quote }}
